<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codeprobe — dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1a1a; --surface: #242424; --border: #3a3a3a;
      --text: #ddd; --dim: #888; --accent: #4a9eff;
      --green: #5cb85c; --orange: #e8883a; --red: #d9534f; --yellow: #c9a227;
      --mono: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--accent); }
    .logo span { color: var(--dim); font-weight: 400; }

    .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 42px); }

    /* User list */
    .user-list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); }
    .user-list-header { padding: 10px 12px; font-size: 11px; color: var(--dim); text-transform: uppercase; font-weight: 600; border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
    .user-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .user-item:hover { background: #2a2a2a; }
    .user-item.active { background: #1a3a5c; border-left: 3px solid var(--accent); }
    .user-id { font-family: var(--mono); font-size: 12px; color: var(--accent); }
    .user-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .user-stats { display: flex; gap: 10px; margin-top: 3px; font-size: 11px; color: var(--dim); }
    .user-stats span { display: flex; align-items: center; gap: 3px; }

    /* Timeline */
    .timeline-panel { overflow-y: auto; padding: 16px 24px; }
    .timeline-empty { color: var(--dim); text-align: center; margin-top: 40vh; font-size: 13px; }

    .timeline-header { font-size: 12px; color: var(--dim); margin-bottom: 16px; font-family: var(--mono); }

    .event { display: flex; gap: 12px; margin-bottom: 2px; padding: 6px 0; }
    .event-time { font-family: var(--mono); font-size: 11px; color: var(--dim); min-width: 70px; text-align: right; flex-shrink: 0; padding-top: 2px; }
    .event-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .event-body { flex: 1; min-width: 0; }
    .event-type { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .event-detail { font-size: 12px; color: var(--dim); margin-top: 2px; word-break: break-word; }
    .event-text { font-size: 12px; color: var(--text); margin-top: 4px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }

    /* Event colors */
    .ev-page_load .event-dot { background: var(--dim); }
    .ev-page_load .event-type { color: var(--dim); }
    .ev-lesson_open .event-dot { background: var(--accent); }
    .ev-lesson_open .event-type { color: var(--accent); }
    .ev-seed_click .event-dot { background: var(--yellow); }
    .ev-seed_click .event-type { color: var(--yellow); }
    .ev-start_learning .event-dot { background: var(--green); }
    .ev-start_learning .event-type { color: var(--green); }
    .ev-user_msg .event-dot { background: #5599dd; }
    .ev-user_msg .event-type { color: #5599dd; }
    .ev-tutor_reply .event-dot { background: #9b6ed8; }
    .ev-tutor_reply .event-type { color: #9b6ed8; }
    .ev-phase_change .event-dot { background: var(--orange); }
    .ev-phase_change .event-type { color: var(--orange); }
    .ev-lesson_complete .event-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .ev-lesson_complete .event-type { color: var(--green); }
    .ev-copy_prompt .event-dot { background: var(--yellow); }
    .ev-copy_prompt .event-type { color: var(--yellow); }
    .ev-back_home .event-dot { background: var(--dim); }
    .ev-back_home .event-type { color: var(--dim); }
    .ev-feedback .event-dot { background: #e84aff; box-shadow: 0 0 6px #e84aff; }
    .ev-feedback .event-type { color: #e84aff; }
    .ev-assessment_start .event-dot { background: var(--orange); }
    .ev-assessment_start .event-type { color: var(--orange); }
    .ev-assessment_answer .event-dot { background: var(--accent); }
    .ev-assessment_answer .event-type { color: var(--accent); }
    .ev-assessment_complete .event-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .ev-assessment_complete .event-type { color: var(--green); }

    /* Connector line between events */
    .event-connector { width: 10px; display: flex; justify-content: center; flex-shrink: 0; }
    .event-connector .line { width: 1px; background: var(--border); height: 100%; min-height: 8px; }

    .no-users { padding: 20px; color: var(--dim); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <span class="logo">codeprobe <span>dashboard</span></span>
    <div style="display:flex;gap:8px;align-items:center;">
      <label style="font-size:12px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="hide-bots" checked> hide &lt;2 events
      </label>
      <button id="refresh-btn" style="background:none;border:1px solid var(--border);color:var(--dim);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;">refresh</button>
    </div>
  </header>

  <div class="layout">
    <div class="user-list">
      <div class="user-list-header">users</div>
      <div id="users"></div>
    </div>
    <div class="timeline-panel" id="timeline">
      <div class="timeline-empty">select a user to view their timeline</div>
    </div>
  </div>

  <script src="/dashboard.js" defer></script>
</body>
</html>
