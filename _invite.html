<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css?v=9">
  <style>
    .invite-wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .invite-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      max-width: 520px;
      margin: 40px auto;
      text-align: center;
    }
    .invite-box h2 { font-size: 18px; margin-bottom: 12px; }
    .invite-box p { font-size: 13px; color: var(--dim); margin-bottom: 16px; line-height: 1.6; }
    .invite-code {
      display: inline-block;
      font-family: var(--mono);
      color: var(--accent);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .invite-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .invite-label input { accent-color: var(--green); width: 16px; height: 16px; }
    .invite-status { min-height: 20px; margin-top: 14px; }
  </style>
</head>
<body>

  <header id="header">
    <div class="header-left">
      <a href="/" class="logo">codeprobe</a>
      <span class="header-flow">Invite</span>
    </div>
    <button id="theme-toggle" class="theme-toggle" title="Toggle theme"></button>
  </header>

  <div class="invite-wrap">
    <div class="invite-box">
      <h2>CodeProbe Invite</h2>
      <p>
        You opened invite <span class="invite-code" id="invite-code"></span>.
        To continue, consent to anonymous event recording for this session.
      </p>
      <label class="invite-label">
        <input type="checkbox" id="consent-check">
        <span>I agree to participate and have this invite recorded anonymously</span>
      </label>
      <button id="consent-start" class="btn-primary" disabled>Continue</button>
      <p id="invite-status" class="invite-status"></p>
    </div>
  </div>

  <script type="module" src="/invite_app.js?v=1"></script>
</body>
</html>
